[package]
name = "open-typeless"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
cpal = "0.18"
eframe = "0.37"
enigo = "0.6"
global-hotkey = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tray-icon = "0.26.1"
ureq = { version = "3", features = ["json"] }

# AppKit, for the two window things egui has no builder for: the backdrop
# blur and the Dock tile. Both versions are already in the tree via winit.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication", "NSColor", "NSGraphics", "NSImage", "NSResponder",
    "NSView", "NSVisualEffectView", "NSWindow",
] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSDictionary", "NSGeometry", "NSString", "NSUUID", "NSValue"] }
# Core Audio process taps: system audio with no driver and no screen capture.
objc2-core-audio = { version = "0.3", features = ["AudioHardware", "objc2", "objc2-core-audio-types", "objc2-foundation", "std"] }
objc2-core-audio-types = { version = "0.3", features = ["CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3", features = ["CFDictionary", "CFString", "CFBase"] }

[dev-dependencies]
egui_kittest = "0.37"
